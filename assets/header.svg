<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-label="BROWSER ANTI-OOM — ONAR-77. headless browser on-demand · zero idle RAM · zero zombies">
  <defs>
    <style><![CDATA[
      .paper { fill: #F4EFE4; }
      .hair  { stroke: #111318; fill: none; }
      .kicker { font-family: Georgia, "Times New Roman", serif; font-style: italic;
                font-size: 20px; letter-spacing: 1px; fill: #1B2A4A; }
      .title { font-family: "Arial Black", "Helvetica Neue", Impact, sans-serif;
                font-weight: 900; font-size: 92px; letter-spacing: -4px; fill: #111318; }
      .sub   { font-family: Georgia, serif; font-size: 21px; fill: #3a3d44; }
      .mono  { font-family: ui-monospace, Menlo, monospace; font-size: 13px;
                letter-spacing: 2px; fill: #1B2A4A; }
      .arr   { font-family: Georgia, serif; font-size: 30px; fill: #111318; }
      .stamp { font-family: "Arial Black", Impact, sans-serif; font-size: 17px;
                letter-spacing: 3px; fill: none; stroke: #B23A48; stroke-width: 1.4; }
      .ticker{ font-family: ui-monospace, Menlo, monospace; font-size: 15px;
                letter-spacing: 2px; fill: #C9A227; }
      /* — animations (CSS keyframes run inside GitHub's img render) — */
      @keyframes blink { 0%,49% {opacity:1} 50%,100% {opacity:0} }
      @keyframes rise  { 0%,100% {transform:translateY(0)} 50% {transform:translateY(-14px)} }
      @keyframes flapL { 0%,100% {transform:rotate(0deg)} 50% {transform:rotate(-16deg)} }
      @keyframes flapR { 0%,100% {transform:rotate(0deg)} 50% {transform:rotate(16deg)} }
      @keyframes scroll { 0% {transform:translateX(0)} 100% {transform:translateX(-672px)} }
      @keyframes wig   { 0%,100% {transform:rotate(-2deg)} 50% {transform:rotate(2deg)} }
      @keyframes draw  { to {stroke-dashoffset: 0;} }
      .cursor { animation: blink 1.1s steps(1) infinite; }
      @keyframes sting { 0%,70%,100% {rotate:0deg} 80% {rotate:-8deg} 90% {rotate:4deg} }
      @keyframes flap  { 0%,100% {scale:1 1} 50% {scale:1 .72} }
      @keyframes rise  { 0%,100% {translate:0 0} 50% {translate:0 -6px} }
      @keyframes chase { 0%,55%,100% {opacity:.25} 25% {opacity:1} }
      .scorp2,.eagle2,.phx2 { transform-box: fill-box; }
      .scorp2 { transform-origin: 20% 80%; animation: sting 3s ease-in-out infinite; }
      .eagle2 { transform-origin: center; animation: flap 1.9s ease-in-out infinite; }
      .phx2   { transform-origin: center bottom; animation: flap 1.5s ease-in-out infinite, rise 3.2s ease-in-out infinite; }
      .arr2   { animation: chase 2.4s linear infinite; }
      .arr2b  { animation-delay: .5s; }
      .phoenix { transform-origin: 1050px 118px; animation: rise 3.2s ease-in-out infinite; }
      .wL { transform-origin: 1044px 118px; animation: flapL 1.6s ease-in-out infinite; }
      .wR { transform-origin: 1056px 118px; animation: flapR 1.6s ease-in-out infinite; }
      .tape  { animation: scroll 12s linear infinite; }
      .scorp { stroke-dasharray: 220; stroke-dashoffset: 220;
               animation: draw 4s ease-out 0.4s forwards; }
      .coin  { transform-box: fill-box; transform-origin: center; animation: wig 2.4s ease-in-out infinite; }
      .coin2 { animation-delay: .6s; } .coin3 { animation-delay: 1.2s; }
    ]]></style>
    <pattern id="argyle" width="48" height="48" patternUnits="userSpaceOnUse">
      <rect width="48" height="48" fill="#1B2A4A"/>
      <path d="M24 0 L48 24 L24 48 L0 24 Z" fill="none" stroke="#C9A227" stroke-width="1" opacity=".55"/>
      <path d="M0 0 L48 48 M48 0 L0 48" stroke="#F4EFE4" stroke-width=".6" opacity=".18"/>
    </pattern>
    <clipPath id="tapeclip"><rect x="0" y="352" width="1200" height="48"/></clipPath>
  </defs>

  <!-- editorial page -->
  <rect width="1200" height="400" class="paper"/>
  <rect x="10" y="10" width="1180" height="380" class="hair" stroke-width="6"/>
  <rect x="20" y="20" width="1160" height="360" class="hair" stroke-width="1.5"/>

  <!-- preppy argyle sidebar -->
  <rect x="20" y="20" width="64" height="332" fill="url(#argyle)"/>
  <text x="52" y="196" transform="rotate(-90 52 196)" text-anchor="middle"
        class="mono" style="fill:#F4EFE4">NO. 77 — EST. MMXXVI</text>

  <!-- masthead -->
  <text x="116" y="72" class="kicker">The BROWSER ANTI-OOM Journal · edisi harian, terbit sambil tidur</text>
  <line x1="116" y1="86" x2="1160" y2="86" class="hair" stroke-width="2"/>
  <line x1="116" y1="92" x2="1160" y2="92" class="hair" stroke-width="1"/>

  <text x="110" y="188" class="title">BROWSER ANTI-OOM</text>

  <!-- headline rules + subtitle (editorial) -->
  <line x1="116" y1="216" x2="880" y2="216" class="hair" stroke-width="6"/>
  <text x="116" y="252" class="sub">headless browser on-demand · zero idle RAM · zero zombies</text>
  <!-- identity triple: drawn, not emoji-font -->
  <g class="scorp2" transform="translate(116,266) scale(.62)"> fill="none" stroke="#1B2A4A" stroke-width="3.4" stroke-linecap="round">
    <ellipse cx="14" cy="12" rx="12" ry="6" fill="#1B2A4A" stroke="none"/>
    <path d="M26 12 h10 l7 -9 l7 13 l7 -8 h12 q8 0 11 -7 l5 -10"/>
    <circle cx="80" cy="-2" r="2.6" fill="#B23A48" stroke="none"/>
    <path d="M-2 20 l-8 8 M6 22 l-3 9 M16 21 l3 9 M26 19 l8 8"/>
  </g>
  <text x="226" y="292" class="arr arr2">→</text>
  <g class="eagle2" transform="translate(292,280) scale(.38)">
    <path d="M0 14 C-34 -8 -58 0 -72 14 C-52 12 -34 18 -20 26 Z" fill="#111318"/>
    <path d="M0 14 C34 -8 58 0 72 14 C52 12 34 18 20 26 Z" fill="#111318"/>
    <path d="M0 -4 L7 14 L0 34 L-7 14 Z" fill="#C9A227"/>
    <circle cx="0" cy="-8" r="5" fill="#B23A48"/>
  </g>
  <text x="352" y="292" class="arr arr2 arr2b">→</text>
  <g class="phx2" transform="translate(420,280) scale(.38)">
    <path d="M0 14 C-34 -8 -58 0 -72 14 C-52 12 -34 18 -20 26 Z" fill="#FF6B2C"/>
    <path d="M0 14 C34 -8 58 0 72 14 C52 12 34 18 20 26 Z" fill="#FF6B2C"/>
    <path d="M0 -4 L7 14 L0 40 L-7 14 Z" fill="#C9A227"/>
    <path d="M0 40 q-6 14 0 24 q8 -8 0 -24" fill="#B23A48" stroke="none"/>
    <circle cx="0" cy="-8" r="5" fill="#FFD98A" stroke="#B23A48" stroke-width="2"/>
  </g>

  <!-- Gen X rotated stamp -->
  <g transform="rotate(-8 1010 250)">
    <rect x="936" y="226" width="224" height="42" fill="none" stroke="#B23A48" stroke-width="2.5"/>
    <text x="1048" y="254" text-anchor="middle" class="stamp">RECEIPTS INCLUDED</text>
  </g>

  <!-- phoenix rising, flapping (line art, brutalist) -->
  <g class="phoenix">
    <g class="wL"><path d="M1044 118 C1010 96 986 104 972 118 C992 116 1010 122 1024 130 Z" fill="#111318"/></g>
    <g class="wR"><path d="M1056 118 C1090 96 1114 104 1128 118 C1108 116 1090 122 1076 130 Z" fill="#111318"/></g>
    <path d="M1050 104 L1056 118 L1050 140 L1044 118 Z" fill="#C9A227" stroke="#111318"/>
    <circle cx="1050" cy="102" r="4" fill="#B23A48"/>
  </g>

  <!-- scorpio, self-drawing constellation -->
  <g class="scorp" stroke="#1B2A4A" stroke-width="2" fill="none" stroke-linecap="round">
    <path d="M900 322 h26 l8 -10 l8 14 l8 -8 h30 q10 0 14 -8 l6 -12"/>
  </g>
  <g fill="#B23A48"><circle cx="1000" cy="298" r="3.4"/></g>
  <g fill="#1B2A4A">
    <circle cx="900" cy="322" r="2.2"/><circle cx="926" cy="322" r="2.2"/>
    <circle cx="934" cy="312" r="2.2"/><circle cx="942" cy="326" r="2.2"/>
  </g>

  <!-- coins -->
  <g stroke="#111318" stroke-width="2">
    <g class="coin"><ellipse cx="860" cy="332" rx="16" ry="6" fill="#C9A227"/><ellipse cx="860" cy="327" rx="16" ry="6" fill="#EBD06B"/></g>
    <g class="coin coin2"><ellipse cx="916" cy="340" rx="13" ry="5" fill="#C9A227"/><ellipse cx="916" cy="336" rx="13" ry="5" fill="#EBD06B"/></g>
    <g class="coin coin3"><ellipse cx="824" cy="342" rx="11" ry="4" fill="#C9A227"/><ellipse cx="824" cy="338" rx="11" ry="4" fill="#EBD06B"/></g>
  </g>

  <!-- ticker tape -->
  <g clip-path="url(#tapeclip)">
    <rect x="0" y="352" width="1200" height="48" fill="#1B2A4A"/>
    <g class="tape">
      <text x="20" y="382" class="ticker">Bash  ✦  Chromium  ✦  Playwright  ✦  flock  ✦  VPS  ✦  </text>
      <text x="692" y="382" class="ticker">Bash  ✦  Chromium  ✦  Playwright  ✦  flock  ✦  VPS  ✦  </text>
      <text x="1364" y="382" class="ticker">Bash  ✦  Chromium  ✦  Playwright  ✦  flock  ✦  VPS  ✦  </text>
    </g>
  </g>
  <line x1="20" y1="352" x2="1180" y2="352" stroke="#111318" stroke-width="3"/>
</svg>
